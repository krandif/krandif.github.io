<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>クマ鈴</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: -apple-system, "Noto Sans JP", sans-serif; background:#111; color:#eee; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { font-size:12px; color:#999; margin-bottom:20px; }
  button { width:100%; padding:18px; font-size:18px; border:0; border-radius:12px; background:#2f7d4f; color:#fff; margin-bottom:12px; }
  button.stop { background:#8a3a3a; }
  button.sub { background:#333; font-size:14px; padding:12px; }
  .row { margin:16px 0; }
  label { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
  input[type=range] { width:100%; }
  .meter { height:10px; background:#333; border-radius:5px; overflow:hidden; margin-top:6px; }
  .meter > div { height:100%; width:0%; background:#4aa3ff; }
  .stat { display:flex; justify-content:space-between; font-size:14px; margin:10px 0; }
  #msg { font-size:13px; color:#e0b050; min-height:1.4em; margin-top:8px; white-space:pre-wrap; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; margin:10px 0; }
  select { width:100%; padding:12px; font-size:16px; border-radius:8px; background:#222; color:#eee; border:1px solid #444; }
  .diag { font-size:12px; color:#9ab; background:#1b1b1b; border-radius:8px; padding:8px 10px; margin:10px 0; line-height:1.7; }
</style>
</head>
<body>
<h1>クマ鈴</h1>
<div class="sub">歩く揺れを検知して鈴の音を鳴らす試作版</div>

<button id="toggle">開始</button>
<button id="test" class="sub">音のテスト</button>

<div class="row">
  <label><span>音色(選ぶと試し聴きできます)</span></label>
  <select id="voice">
    <option value="cute" selected>かわいい鈴(チリリン)</option>
    <option value="bear">大きめの鈴</option>
    <option value="wind">風鈴風</option>
  </select>
</div>
<div class="row">
  <label><span>音量</span><span id="volV">70</span></label>
  <input id="vol" type="range" min="0" max="100" value="70">
</div>
<div class="row">
  <label><span>感度(小さいほど反応しやすい)</span><span id="thV">1.0</span></label>
  <input id="th" type="range" min="0.2" max="5" step="0.1" value="1.0">
  <div class="meter"><div id="bar"></div></div>
</div>

<div class="row">
  <label><span>鳴らす頻度(◯回の検知に1回鳴らす)</span><span id="everyV">4</span></label>
  <input id="every" type="range" min="1" max="10" step="1" value="4">
</div>

<div class="diag" id="diag">
  <div>センサー受信: <span id="dEvt">0</span> 回</div>
  <div>揺れの大きさ: <span id="dDev">-</span></div>
  <div>最大値(直近3秒): <span id="dMax">-</span></div>
</div>

<div class="chk"><input id="timerMode" type="checkbox"><label for="timerMode" style="margin:0">タイマーモード(センサーなしで一定間隔で鳴らす)</label></div>

<div class="stat"><span>検知した歩数</span><span id="steps">0</span></div>
<div id="msg"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let ctx = null, master = null, running = false;
  let wakeLock = null, timerId = null;
  let baseline = null, lastStep = 0, steps = 0;
  let evtCount = 0, recent = [], lastUi = 0, checkId = null;
  const MIN_INTERVAL = 280; // ms。これより短い間隔では鳴らさない

  const say = t => { $('msg').textContent = t; };

  // 音色のプリセット。strikes は [開始秒, 周波数の倍率, 音量] の配列(複数回叩く鈴の音)
  const VOICES = {
    cute: { base: [2700, 3200], ratios: [1, 2.71, 4.93, 7.4], gains: [0.5, 0.28, 0.14, 0.07],
            decay: [0.9, 0.5, 0.3, 0.16], beat: 0.004, click: 0.35,
            strikes: [[0, 1, 1], [0.075, 1.07, 0.7]] },
    bear: { base: [2200, 2700], ratios: [1, 2.76, 5.4, 8.93], gains: [0.5, 0.3, 0.15, 0.08],
            decay: [1.3, 0.85, 0.5, 0.28], beat: 0.003, click: 0.25,
            strikes: [[0, 1, 1]] },
    wind: { base: [3400, 3900], ratios: [1, 2.4, 4.1, 6.2], gains: [0.45, 0.25, 0.12, 0.06],
            decay: [2.2, 1.4, 0.8, 0.4], beat: 0.006, click: 0.1,
            strikes: [[0, 1, 1]] }
  };

  // 鈴の合成音: 非整数倍の倍音、うなり、叩いた瞬間の金属音を重ねる
  function ring() {
    if (!ctx) return;
    const v = VOICES[$('voice').value] || VOICES.cute;
    const t0 = ctx.currentTime;
    const base = v.base[0] + Math.random() * (v.base[1] - v.base[0]);
    // 高域の刺さりを抑える
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 11000;
    lp.connect(master);
    v.strikes.forEach(([dt, mult, vol]) => {
      const now = t0 + dt;
      v.ratios.forEach((r, i) => {
        const f = base * mult * r;
        if (f > 16000) return;
        // 周波数をわずかにずらした2本を重ねて、鈴特有のうなり(きらきらした揺れ)を作る
        [1, 1 + v.beat].forEach(detune => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.value = f * detune;
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(v.gains[i] * vol * 0.4, now + 0.002);
          g.gain.exponentialRampToValueAtTime(0.0001, now + v.decay[i]);
          o.connect(g); g.connect(lp);
          o.start(now); o.stop(now + v.decay[i] + 0.05);
        });
      });
      // 叩いた瞬間の「チッ」という短い金属音
      if (v.click > 0) {
        const len = Math.floor(ctx.sampleRate * 0.02);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / len);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const bp = ctx.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = base * 2; bp.Q.value = 1.2;
        const cg = ctx.createGain();
        cg.gain.value = v.click * vol * 0.4;
        src.connect(bp); bp.connect(cg); cg.connect(lp);
        src.start(now);
      }
    });
  }

  function onMotion(e) {
    // 重力を除いた加速度が取れる端末はそれを使う。なければ重力込みの値から差し引く
    let dev = null;
    const la = e.acceleration;
    if (la && la.x != null) {
      dev = Math.sqrt(la.x*la.x + la.y*la.y + la.z*la.z);
    } else {
      const a = e.accelerationIncludingGravity;
      if (!a || a.x == null) return;
      const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
      if (baseline === null) baseline = mag;
      baseline = baseline * 0.98 + mag * 0.02;        // 歩行の周期より遅く追従させる
      dev = Math.abs(mag - baseline);
    }
    evtCount++;
    const t = performance.now();
    recent.push([t, dev]);
    while (recent.length && t - recent[0][0] > 3000) recent.shift();
    if (t - lastUi > 100) {
      lastUi = t;
      $('bar').style.width = Math.min(100, dev / 6 * 100) + '%';
      $('dEvt').textContent = evtCount;
      $('dDev').textContent = dev.toFixed(2);
      $('dMax').textContent = Math.max(...recent.map(r => r[1])).toFixed(2);
    }
    const th = parseFloat($('th').value);
    if (dev > th && t - lastStep > MIN_INTERVAL) {
      lastStep = t;
      steps++;
      $('steps').textContent = steps;
      const n = parseInt($('every').value, 10) || 1;
      if ((steps - 1) % n === 0) ring();   // 1回目で鳴らし、以降は n 回に1回
    }
  }

  async function start() {
    // iOS は、タップ直後の最初の処理として許可を求める必要がある(他の await より先に実行)
    if (!$('timerMode').checked &&
        typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      let res = 'denied';
      try { res = await DeviceMotionEvent.requestPermission(); }
      catch (err) { say('許可の確認でエラー: ' + err.name + '\nページを閉じて開き直し、もう一度「開始」を押してください'); return; }
      if (res !== 'granted') {
        say('モーションセンサーの許可が得られませんでした。\n1. Safariのタブを閉じて、URLを開き直す\n2. 「開始」を押し、ダイアログで「許可」を選ぶ\n3. ダイアログが出ない場合は、iPhoneの「設定」→「Safari」→「詳細」で「モーションと画面の向きへのアクセス」をオンにする\n4. LINEなどアプリ内のブラウザではなく、SafariかChromeで開く');
        return;
      }
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = ctx || new AC();
    await ctx.resume();
    master = master || ctx.createGain();
    master.connect(ctx.destination);
    master.gain.value = $('vol').value / 100;

    if ($('timerMode').checked) {
      timerId = setInterval(ring, 1200);
      say('タイマーモードで動作中(1.2秒間隔)');
    } else {
      evtCount = 0; recent = []; baseline = null;
      window.addEventListener('devicemotion', onMotion);
      say('歩くと鳴ります。画面は点灯したままにしてください');
      // 2.5秒たってもセンサー値が来ない場合は原因の候補を表示する
      checkId = setTimeout(() => {
        if (running && evtCount === 0) {
          say('センサーの値が届いていません。\n・HTTPSのURLで開いているか確認\n・Androidのブラウザは、サイト設定の「モーションセンサー」を許可\n・省電力モードを切る\n・だめな場合はタイマーモードを使用');
        }
      }, 2500);
    }

    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    running = true;
    $('toggle').textContent = '停止';
    $('toggle').classList.add('stop');
  }

  function stop() {
    window.removeEventListener('devicemotion', onMotion);
    if (checkId) { clearTimeout(checkId); checkId = null; }
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    running = false;
    $('toggle').textContent = '開始';
    $('toggle').classList.remove('stop');
    $('bar').style.width = '0%';
    say('停止中');
  }

  $('toggle').onclick = () => running ? stop() : start().catch(e => say('起動エラー: ' + e.message));
  $('test').onclick = async () => {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = ctx || new AC();
    await ctx.resume();
    if (!master) { master = ctx.createGain(); master.connect(ctx.destination); }
    master.gain.value = $('vol').value / 100;
    ring();
  };
  $('vol').oninput = e => { $('volV').textContent = e.target.value; if (master) master.gain.value = e.target.value / 100; };
  $('th').oninput = e => { $('thV').textContent = e.target.value; };
  $('every').oninput = e => { $('everyV').textContent = e.target.value; };
  $('voice').onchange = () => $('test').onclick();   // 音色を選ぶと試し聴き

  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
    }
  });

  if (!window.isSecureContext) say('HTTPSで開いていないと、センサーが使えない場合があります');
})();
</script>
</body>
</html>
